spring:
  application:
    name: resize
  kafka:
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            key:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            type:
              mapping: "image.module.convert.dto.SendKafkaMessage:image.module.resize.dto.ReceiveKafkaMessage"
server:
  port: 19098

# 모니터링 및 트레이싱 설정
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics # metrics 추가 권장

  # Zipkin 전송 설정
  zipkin:
    tracing:
      endpoint: "http://zipkin:9411/api/v2/spans" # Docker Compose 서비스명 'zipkin' 기준

  # 트레이싱 샘플링 비율 (개발 환경은 100% 수집)
  tracing:
    sampling:
      probability: 1.0

# [추가] 로그 포맷 설정 (TraceID, SpanID를 로그에 남기기 위함)
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"