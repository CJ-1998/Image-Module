plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'image.module'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2023.0.3")
}

dependencies {
// EurekaClient
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// feignClient
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// kafka
	implementation 'org.springframework.kafka:spring-kafka'

	//minio
	implementation 'io.minio:minio:8.5.0'
	implementation 'com.squareup.okhttp3:okhttp:4.9.3'

	// webp 이미지 리사이징
	implementation 'com.sksamuel.scrimage:scrimage-core:4.0.32'
	implementation 'com.sksamuel.scrimage:scrimage-webp:4.0.32'

	// 이미지 파일 복사
	implementation 'commons-io:commons-io:2.11.0'

	// [모니터링] Actuator: 애플리케이션 상태 및 메트릭 노출
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// [모니터링] Prometheus: Actuator 메트릭을 Prometheus 포맷으로 변환
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// [트레이싱] Micrometer Tracing (Spring Boot 3.x 표준)
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'

	// [트레이싱] Zipkin Reporter: 트레이싱 데이터를 Zipkin 서버로 전송
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
