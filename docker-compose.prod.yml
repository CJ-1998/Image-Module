# up 명령어 : docker-compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# down 명령어 : docker-compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml down
# log 명령어 : docker-compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml logs -f

version: '3.8'

services:
  # --- Infra (Secure Mode) ---
  # 운영 환경에서는 DB 포트를 외부에 열지 않거나, 외부 관리형 DB를 사용함
  server-data-db:
    restart: always
    env_file: .env.prod
    # ports 섹션 없음 (내부 통신만 허용)

  minio:
    restart: always
    env_file: .env.prod
    # ports 섹션 없음 (Gateway나 서비스를 통해서만 접근 권장)
    # 단, MinIO Console 접속이 필요하다면 포트를 열어야 함

  redis:
    restart: always

  kafka:
    restart: always

  # --- Apps (Prod Profile & Env) ---
  eureka:
    restart: always
    ports:
      - "19090:19090"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  gateway:
    restart: always
    ports:
      - "19091:19091"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  cdn:
    restart: always
    ports:
      - "19096:19096"
    volumes:
      # 운영용 경로 매핑 (.env.prod 참조)
      - ${CDN_LOCAL_PATH}:/app/cdn/images
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  url:
    restart: always
    ports:
      - "19093:19093"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  data:
    restart: always
    ports:
      - "19095:19095"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  upload:
    restart: always
    ports:
      - "19092:19092"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  convert:
    restart: always
    ports:
      - "19097:19097"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  resize:
    restart: always
    ports:
      - "19098:19098"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  zipkin:
    # 운영에서는 보통 9411 포트를 외부로 열지 않고 내부망에서만 통신하게 둡니다.
    expose:
      - "9411"

  prometheus:
    expose:
      - "9090"
    volumes:
      # 운영용 설정 파일 마운트
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      # [중요] Prometheus 수집 데이터를 호스트에 영구 저장 (컨테이너 재시작 시 날아감 방지)
      - prometheus_data:/prometheus

  grafana:
    ports:
      - "3000:3000" # 관리자 접속을 위해 그라파나만 외부 노출 (원한다면 Nginx/Gateway 뒤로 숨김 가능)
    volumes:
      # [중요] 대시보드 및 설정 데이터를 영구 저장
      - grafana_data:/var/lib/grafana

  loki:
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      # [중요] 수집된 로그 데이터를 영구 저장
      - loki_data:/loki

  promtail:
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  nginx:
    ports:
      - "80:80"
      - "443:443"  # 포트폴리오 고도화 시 HTTPS(SSL) 적용을 위해 미리 열어둠
    volumes:
      # Nginx 설정 파일 마운트
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    env_file: .env.prod

# [중요] 운영 환경에서 데이터를 영구 보존하기 위한 Docker Named Volumes 선언
volumes:
  prometheus_data:
  grafana_data:
  loki_data: