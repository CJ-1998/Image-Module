# up 명령어 : docker-compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# down 명령어 : docker-compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml down
# log 명령어 : docker-compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml logs -f

version: '3.8'

services:
  # --- Infra (Secure Mode) ---
  # 운영 환경에서는 DB 포트를 외부에 열지 않거나, 외부 관리형 DB를 사용함
  server-data-db:
    restart: always
    env_file: .env.prod
    # ports 섹션 없음 (내부 통신만 허용)

  minio:
    restart: always
    env_file: .env.prod
    # ports 섹션 없음 (Gateway나 서비스를 통해서만 접근 권장)
    # 단, MinIO Console 접속이 필요하다면 포트를 열어야 함

  redis:
    restart: always

  kafka:
    restart: always

  # --- Apps (Prod Profile & Env) ---
  eureka:
    restart: always
    ports:
      - "19090:19090"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  gateway:
    restart: always
    ports:
      - "19091:19091"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  cdn:
    restart: always
    ports:
      - "19096:19096"
    volumes:
      # 운영용 경로 매핑 (.env.prod 참조)
      - ${CDN_LOCAL_PATH}:/app/cdn/images
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  url:
    restart: always
    ports:
      - "19093:19093"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  data:
    restart: always
    ports:
      - "19095:19095"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  upload:
    restart: always
    ports:
      - "19092:19092"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  convert:
    restart: always
    ports:
      - "19097:19097"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  resize:
    restart: always
    ports:
      - "19098:19098"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
