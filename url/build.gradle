plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'image.module'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' } // JitPack 저장소 추가 (필요시)
}

ext {
	set('springCloudVersion', "2023.0.3")
}

dependencies {
	// TwelveMonkeys ImageIO 라이브러리 (이미지 변환을 위해)
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.8.2'
	//minio
	implementation 'io.minio:minio:8.5.0'
	implementation 'com.squareup.okhttp3:okhttp:4.9.2' // OkHttp 의존성 추가

	// [모니터링] Actuator: 애플리케이션 상태 및 메트릭 노출
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// [모니터링] Prometheus: Actuator 메트릭을 Prometheus 포맷으로 변환
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// [트레이싱] Micrometer Tracing (Spring Boot 3.x 표준)
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'

	// [트레이싱] Zipkin Reporter: 트레이싱 데이터를 Zipkin 서버로 전송
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
