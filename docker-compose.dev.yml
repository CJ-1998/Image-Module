# up 명령어 : docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# down 명령어 : docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml down
# log 명령어 : docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml logs -f

version: '3.8'

services:
  # --- Infra Config (Dev) ---
  server-data-db:
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    ports:
      - "6379:6379"

  zipkin:
    ports:
      - "9411:9411"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data

  zookeeper:
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    ports:
      - "9080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"
    networks:
      - image_network

  # --- Apps Build Config (Dev) ---

  eureka:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./eureka
    ports:
      - "19090:19090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./gateway
    ports:
      - "19091:19091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  upload:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./upload
    ports:
      - "19092:19092"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_URL}

  cdn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./cdn
    ports:
      - "19096:19096"
    volumes:
      - ./cdn/images:/app/cdn/images
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  url:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./url
    ports:
      - "19093:19093"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  data:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./data
    ports:
      - "19095:19095"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  convert:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./convert
    ports:
      - "19097:19097"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_URL}

  resize:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - FILE_DIRECTORY=./resize
    ports:
      - "19098:19098"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_URL}
