spring:
  application:
    name: cdn
server:
  port: 19096
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
