global:
  scrape_interval: 15s # 개발 환경은 즉각적인 확인을 위해 15초
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # docker-compose 내부 DNS(서비스명)를 사용합니다.
      # 주의: 각 서비스의 실제 내부 포트 번호로 맞춰주세요! (예: gateway는 19091)
      - targets:
          - 'gateway:19091'
          - 'eureka:19090'
          - 'upload:19092'
          - 'data:19095'
          - 'resize:19098'
          - 'convert:19097'
          - 'cdn:19096'
          - 'url:19093'