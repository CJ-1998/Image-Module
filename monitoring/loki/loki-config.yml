auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb # 최근 Loki의 표준 시계열 DB 포맷
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# [운영 환경 필수 고려사항] 디스크 용량 관리를 위한 로그 보존 주기(Retention) 설정
limits_config:
  retention_period: 168h # 7일(168시간)이 지난 로그는 자동 삭제

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  retention_enabled: true