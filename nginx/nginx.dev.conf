user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================================
    # 성능 최적화 (Zero-copy)
    # ==========================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # 개발 환경이므로 브라우저 캐싱 비활성화 (수정 시 즉각 확인용)
    expires off;

    # 백엔드 서버 그룹 정의 (Docker Compose 서비스명 기준)
    upstream backend_cdn {
        server cdn:19096;
    }
    upstream backend_gateway {
        server gateway:19091;
    }

    server {
        listen 80;
        server_name localhost;

        # ==========================================
        # 1. 이미지 다운로드 API (/cdn/download/{uuid})
        # ==========================================
        location ~ ^/cdn/download/([a-zA-Z0-9-]+)$ {
            root /var/www/images; # docker-compose에서 마운트한 경로

            # 브라우저가 파일을 화면에 띄우지 않고 강제로 다운로드하도록 헤더 추가
            add_header Content-Disposition 'attachment; filename="$1"';

            # 1순위: /var/www/images/$1 파일이 있는지 확인 (있으면 Zero-copy 서빙)
            # 2순위: 파일이 없으면 @cdn_fallback(Spring Boot)으로 요청 전달
            try_files /$1 /$1.jpg /$1.png /$1.jpeg /$1.webp @cdn_fallback;
        }

        # ==========================================
        # 2. 이미지 조회 API (/cdn/{uuid})
        # ==========================================
        location ~ ^/cdn/([a-zA-Z0-9-]+)$ {
            root /var/www/images;

            try_files /$1 /$1.jpg /$1.png /$1.jpeg /$1.webp @cdn_fallback;
        }

        # ==========================================
        # Fallback & Gateway Routing
        # ==========================================
        # 로컬(Nginx)에 이미지가 없을 때 처리할 로직
        location @cdn_fallback {
            proxy_pass http://backend_cdn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # cdn 관련이 아닌 기타 모든 API 요청은 Gateway로 넘김
        location / {
            proxy_pass http://backend_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}