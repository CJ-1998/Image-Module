user nginx;
worker_processes auto;
worker_rlimit_nofile 65535; # 최대 파일 열기 갯수 증가 (고부하 대비)

events {
    worker_connections 4096;
    use epoll; # Linux 환경에서 성능이 뛰어난 I/O 모델 사용
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 보안: Nginx 버전 정보 숨김 (해커의 취약점 타겟팅 방지)
    server_tokens off;

    # ==========================================
    # 성능 최적화 (Zero-copy 및 커넥션)
    # ==========================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 500; # 한 커넥션에서 처리할 수 있는 최대 요청 수

    upstream backend_cdn {
        server cdn:19096;
    }
    upstream backend_gateway {
        server gateway:19091;
    }

    server {
        listen 80;
        # server_name cdn.my-domain.com; # 실제 운영 시 도메인으로 변경

        # ==========================================
        # 1. 이미지 다운로드 API
        # ==========================================
        location ~ ^/cdn/download/([a-zA-Z0-9-]+)$ {
            root /var/www/images;

            add_header Content-Disposition 'attachment; filename="$1"';

            try_files /$1 @cdn_fallback;
        }

        # ==========================================
        # 2. 이미지 조회 API (운영 환경 캐싱 적용)
        # ==========================================
        location ~ ^/cdn/([a-zA-Z0-9-]+)$ {
            root /var/www/images;

            # 클라이언트 브라우저 캐싱을 30일로 설정 (재방문 시 서버 요청 안 함)
            expires 30d;
            add_header Cache-Control "public, no-transform";

            try_files /$1 @cdn_fallback;
        }

        location @cdn_fallback {
            proxy_pass http://backend_cdn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 기타 API
        location / {
            proxy_pass http://backend_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}