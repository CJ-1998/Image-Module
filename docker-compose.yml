version: '3.8'

services:
  # =========================================
  # 1. Infrastructure Services (Base)
  # =========================================
  server-data-db:
    container_name: server_data_db
    image: postgres:15
    restart: always
    volumes:
      - server_data_db:/var/lib/postgresql/data
    networks:
      - image_network
    environment:
      # .env 파일에서 주입받은 값으로 DB 초기화
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # DB가 쿼리를 받을 준비가 되었는지 확인
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: image_redis
    networks:
      - image_network
    # Redis가 응답하는지 ping으로 확인
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio
    volumes:
      - ./data_minio:/data
    networks:
      - image_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"

  # [트레이싱] Zipkin
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: always
    networks:
      - image_network
    # Zipkin 서버가 완전히 켜졌는지 헬스체크 API로 확인
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9411/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # [메트릭 수집] Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - image_network

  # [시각화] Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    networks:
      - image_network

  # [로그 수집 DB] Loki
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - image_network

  # [로그 에이전트] Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    networks:
      - image_network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    networks:
      - image_network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # Zookeeper 구동 상태 확인
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka:latest
    networks:
      - image_network
    depends_on:
      - zookeeper
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 내부/외부 리스너 설정 (개발 편의성 개선)
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    # Kafka 브로커 구동 확인
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - image_network
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"

  # =========================================
  # 2. Application Services (Base)
  # =========================================
  eureka:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./eureka
    networks:
      - image_network
    depends_on:
      zipkin:
        condition: service_healthy
    # Eureka가 요청을 받을 준비가 되었는지 확인
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:19090/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./gateway
    networks:
      - image_network
    depends_on:
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  cdn:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./cdn
    networks:
      - image_network
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  url:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./url
    networks:
      - image_network
    depends_on:
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  data:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./data
    networks:
      - image_network
    depends_on:
      eureka:
        condition: service_healthy
      server-data-db:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  upload:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./upload
    networks:
      - image_network
    depends_on:
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  convert:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./convert
    networks:
      - image_network
    depends_on:
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  resize:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        - FILE_DIRECTORY=./resize
    networks:
      - image_network
    depends_on:
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: image_nginx
    restart: always
    volumes:
      # ★ cdn 서비스와 동일한 호스트 디렉토리를 공유 (Zero-copy를 위해 직접 파일 접근)
      - ${CDN_LOCAL_PATH}:/var/www/images:ro
    networks:
      - image_network
    depends_on:
      - gateway

volumes:
  server_data_db:

networks:
  image_network:
    driver: bridge
